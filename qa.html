<!doctype html><html lang="en"><meta charset="utf-8"><title>Heart Explorer functional QA</title><style>body{background:#091323;color:white;font:14px Arial;margin:20px}iframe{border:1px solid #36546a;display:block;background:#091323}pre{white-space:pre-wrap}.tests{display:flex;gap:25px;align-items:start;overflow:auto}.pass{color:#8cf4d3}.fail{color:#ff8d99}button{padding:10px;margin:10px}</style><h1>Functional checks: mobile and desktop</h1><button id="run">Run all controls</button><pre id="summary">Waiting for models…</pre><div class="tests"><section><h2>Mobile — 390 × 844</h2><iframe id="mobile" width="390" height="844" src="./index.html?qa=mobile-v5"></iframe><pre id="mobileResults"></pre></section><section><h2>Desktop — 1280 × 800</h2><iframe id="desktop" width="1280" height="800" src="./index.html?qa=desktop-v5"></iframe><pre id="desktopResults"></pre></section></div><script>
for(const k of ['mobile','desktop'])document.getElementById(k).src='./index.html?qa='+k+'-'+Date.now();
const sleep=t=>new Promise(r=>setTimeout(r,t));const results=[];
async function waitFor(fn,ms=25000){const start=Date.now();while(!fn()){if(Date.now()-start>ms)throw Error('Timed out');await sleep(100);}}
async function test(frame){const d=frame.contentDocument,w=frame.contentWindow,logs=[],observed=[];const id=x=>d.getElementById(x);function check(name,condition){logs.push({name,pass:!!condition});if(!condition)throw Error(name);}async function click(x){const e=id(x);if(!e)throw Error('Missing button '+x);observed.push(x);e.click();await sleep(30);}async function topic(i){const e=d.querySelector('[data-topic="'+i+'"]');if(!e)throw Error('Missing topic '+i);e.click();await sleep(120);}
try{await waitFor(()=>id('startFree')&&id('nav')?.children.length===9&&id('loading')?.hidden===true);await click('startFree');check('Intro closes',id('intro').hidden);check('Explanations hidden by default',!id('infoPanel').classList.contains('open'));check('Captions hidden by default',id('bubble').hidden);check('Photo-style child guide loads',id('guidePhoto').querySelector('img').complete);
await click('infoToggle');check('Explanation drawer opens',id('infoPanel').classList.contains('open'));await click('closeInfo');check('Explanation closes',!id('infoPanel').classList.contains('open'));await click('guidePhoto');check('Portrait opens explanation',id('infoPanel').classList.contains('open'));await click('closeInfo');await click('captionsToggle');check('Captions open',!id('bubble').hidden);await click('captionsToggle');check('Captions close',id('bubble').hidden);await click('cleanToggle');check('Clean screen mode',d.body.classList.contains('clean-mode'));await click('cleanToggle');
for(let i=0;i<20;i++)await click('zoomIn');await sleep(150);const c=d.querySelector('#scene canvas');check('Zoom-in bounded',Number(c.dataset.cameraDistance)>=5.59);for(let i=0;i<25;i++)await click('zoomOut');await sleep(150);check('Zoom-out bounded',Number(c.dataset.cameraDistance)<=10.51);await click('resetView');await sleep(150);check('Reset returns to normal distance',Math.abs(Number(c.dataset.cameraDistance)-7.6)<.05);
await click('toggleLabels');await click('toggleLabels');await click('autoRotate');check('Auto rotate toggles',id('autoRotate').getAttribute('aria-pressed')==='true');await click('autoRotate');await click('pause');check('Pause works',id('pause').getAttribute('aria-pressed')==='true');await click('pause');await click('voiceToggle');await click('voiceToggle');await click('replay');await click('continueSpeech');await click('aboutBtn');check('Glossary opens',id('about').open);id('about').close();
await topic(1);await click('flowNext');check('Blood-flow next advances',id('flowInfo').textContent.includes('עלייה ימנית'));await click('flowPrev');check('Blood-flow previous returns',id('flowInfo').textContent.includes('הגוף'));await click('flowAuto');await click('flowAuto');await topic(2);await click('startPulse');check('Electrical mission responds',id('spokenText').textContent.includes('האות מתחיל'));await click('slowPulse');check('Slow-motion rate',id('bpmNumber').textContent==='30');await click('slowPulse');check('Normal rate restored',id('bpmNumber').textContent==='72');
await topic(3);await click('irregular');check('Irregular mode selected',id('irregular').classList.contains('active'));await click('regular');check('Regular mode selected',id('regular').classList.contains('active'));id('bpmRange').value='100';id('bpmRange').dispatchEvent(new w.Event('input',{bubbles:true}));check('Heart rate slider',id('bpmValue').textContent==='100');
await topic(4);check('Mapping requires catheter',id('collect').disabled);await click('insert');check('Catheter enables mapping',!id('collect').disabled);for(let i=0;i<4;i++)await click('collect');check('80 mapping points collected',id('mapProgress').textContent.includes('80 / 80'));await click('resetMap');check('Mapping reset',id('mapProgress').textContent.includes('0 / 80')&&id('collect').disabled);
await topic(5);check('Treatment requires target',id('treat').disabled);const target=[...d.querySelectorAll('.label')].find(e=>e.textContent.includes('סמנו'));target.click();await sleep(70);check('Selecting target enables treatment',!id('treat').disabled);await click('treat');check('Treatment result',id('mission').textContent.includes('נחסם'));await click('resetTreatment');check('Treatment reset',id('treat').disabled);
await topic(6);await click('calibrationCheck');check('Incorrect calibration gives feedback',id('calibrationResult').textContent.includes('אינה מתאימה'));id('calibration').value='-12';id('calibration').dispatchEvent(new w.Event('input',{bubbles:true}));await click('calibrationCheck');check('Correct calibration',id('sensorValue').textContent==='100'&&id('calibrationResult').textContent.includes('מתאימה!'));
await topic(8);await click('vesselFull');check('Outer vessel view',id('vesselFull').classList.contains('active'));await click('vesselCut');check('Cutaway vessel view',id('vesselCut').classList.contains('active'));await click('vesselBlood');check('Blood cells toggle',id('vesselBlood').getAttribute('aria-pressed')==='false');await click('vesselBlood');
await topic(7);for(let i=0;i<6;i++){const correct=[0,1,2,0,1,2][i];d.querySelector('[data-answer="'+correct+'"]').click();await sleep(40);check('Quiz feedback '+(i+1),id('feedback').textContent.includes('נכון'));await click('quizNext');}check('Quiz score 6/6',id('quiz').textContent.includes('6 מתוך 6'));await click('restartQuiz');check('Quiz restarts',id('quiz').textContent.includes('שאלה 1'));await click('nextTopic');await click('prevTopic');await click('tourStart');check('Guided tour starts',id('tourProgress').textContent.includes('סיור'));await click('startTour');await click('voiceSamplesBtn');check('Voice chooser opens',id('voiceSamples').open);const tracks=[...id('voiceSamples').querySelectorAll('audio')];check('Five VoxCPM2 samples',tracks.length===5);await waitFor(()=>tracks.every(a=>Number.isFinite(a.duration)&&a.duration>2),20000);check('Five samples decode',tracks.every(a=>a.duration>7&&a.duration<20));const radio=id('voiceSamples').querySelector('input[value="3"]');radio.checked=true;radio.dispatchEvent(new w.Event('change',{bubbles:true}));check('Voice preference saved',w.localStorage.getItem('heartVoiceChoice')==='3');id('voiceSamples').close();w.localStorage.removeItem('heartVoiceChoice');
await topic(0);const f0=Number(c.dataset.frames);await sleep(1500);check('Scene remains responsive after all actions',Number(c.dataset.frames)>f0+5);check('No page horizontal overflow',d.documentElement.scrollWidth<=frame.clientWidth+2);const zr=id('zoomIn').getBoundingClientRect();check('Zoom button is inside mobile viewport',zr.left>=0&&zr.right<=frame.clientWidth+1&&zr.bottom<=frame.clientHeight);
}catch(e){logs.push({name:'STOP: '+e.message,pass:false});}frame.dataset.checkedButtons=[...new Set(observed)].join(',');d.getElementById('reduceMotion').checked=true;d.getElementById('reduceMotion').dispatchEvent(new w.Event('change'));return logs;}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;document.getElementById('summary').textContent='Running every control…';for(const key of ['mobile','desktop']){const logs=await test(document.getElementById(key));results.push({mode:key,checks:logs});document.getElementById(key+'Results').textContent=logs.map(x=>(x.pass?'PASS ':'FAIL ')+x.name).join('\n');}document.getElementById('summary').textContent=JSON.stringify(results,null,2);document.getElementById('run').disabled=false;};
</script></html>
